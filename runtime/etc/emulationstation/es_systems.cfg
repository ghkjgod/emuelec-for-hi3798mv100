<?xml version="1.0"?>
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/storage/roms/nes</path>
    <extension>.nes .NES</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh quicknes %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>
  <system>
    <name>snes</name>
    <fullname>Super Nintendo Entertainment System</fullname>
    <path>/storage/roms/snes</path>
    <extension>.smc .SMC .sfc .SFC .fig .FIG</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh snes9x2010 %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
  </system>
  <system>
    <name>gb</name>
    <fullname>Game Boy and Game Boy Color</fullname>
    <path>/storage/roms/gb</path>
    <extension>.gb .GB .gbc .GBC</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh gambatte %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
  </system>
  <system>
    <name>gba</name>
    <fullname>Game Boy Advance</fullname>
    <path>/storage/roms/gba</path>
    <extension>.gba .GBA</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh vba_next %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>
  <system>
    <name>megadrive</name>
    <fullname>Sega Mega Drive / Genesis</fullname>
    <path>/storage/roms/megadrive</path>
    <extension>.md .MD .mdx .MDX .gen .GEN .bin .BIN .smd .SMD .sms .SMS .gg .GG</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh genesis_plus_gx %ROM%</command>
    <platform>megadrive</platform>
    <theme>megadrive</theme>
  </system>
  <system>
    <name>pce</name>
    <fullname>PC Engine / TurboGrafx-16</fullname>
    <path>/storage/roms/pce</path>
    <extension>.pce .PCE .sgx .SGX .cue .CUE</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh mednafen_pce_fast %ROM%</command>
    <platform>pcengine</platform>
    <theme>pcengine</theme>
  </system>
  <system>
    <name>psx</name>
    <fullname>Sony PlayStation</fullname>
    <path>/storage/roms/psx</path>
    <extension>.cue .CUE .bin .BIN .img .IMG .mdf .MDF .toc .TOC .cbn .CBN .m3u .M3U</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh pcsx_rearmed %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
  </system>
  <system>
    <name>arcade</name>
    <fullname>Arcade (MAME 2003)</fullname>
    <path>/storage/roms/arcade</path>
    <extension>.zip .ZIP</extension>
    <command>${HISTB_EE_ROOT}/bin/run-retroarch.sh mame2003 %ROM%</command>
    <platform>arcade</platform>
    <theme>mame</theme>
  </system>
  <system>
    <name>diagnostics</name>
    <fullname>HiSTB Diagnostics</fullname>
    <path>/storage/ee/diagnostics</path>
    <extension>.sh .SH</extension>
    <command>/bin/sh %ROM%</command>
    <platform>ignore</platform>
    <theme>ports</theme>
  </system>
</systemList>
